<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scenic Mountain Spelling Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes sunPulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        .sun-glow {
            animation: sunPulse 4s ease-in-out infinite;
            cursor: pointer;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes bounceSuccess {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-success {
            animation: bounceSuccess 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="relative w-screen h-screen bg-sky-200 select-none flex flex-col justify-between overflow-hidden">

    <svg id="gameSvg" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 900 1440" preserveAspectRatio="xMidYMid slice">
        <defs>
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#bae6fd" />
                <stop offset="50%" stop-color="#e0f2fe" />
                <stop offset="100%" stop-color="#fef08a" />
            </linearGradient>
            <linearGradient id="beachSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fed7aa" />
                <stop offset="100%" stop-color="#ffedd5" />
            </linearGradient>
            <linearGradient id="level3SkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e0e7ff" />
                <stop offset="100%" stop-color="#fae8ff" />
            </linearGradient>
            <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#4ade80" />
                <stop offset="100%" stop-color="#16a34a" />
            </linearGradient>
            <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#86efac" />
                <stop offset="100%" stop-color="#15803d" />
            </linearGradient>
        </defs>

        <!-- LEVEL 0: START SCREEN -->
        <g id="level0Group">
            <rect width="900" height="1440" fill="url(#skyGrad)" />
            <path d="M-50 1100 Q 250 950 500 1100 T 950 1080 L 950 1440 L -50 1440 Z" fill="url(#hillGrad1)" />
            
            <g id="level0Sun" class="pointer-events-auto cursor-pointer group" transform="translate(450, 600)">
                <circle cx="0" cy="0" r="160" fill="#fef08a" opacity="0.4" class="sun-glow" />
                <circle cx="0" cy="0" r="130" fill="#fde047" opacity="0.8" class="sun-glow" />
                <circle cx="0" cy="0" r="105" fill="#facc15" />
                <text x="0" y="15" text-anchor="middle" fill="#713f12" font-size="48" font-weight="900" class="tracking-wider uppercase drop-shadow-md">START</text>
            </g>
        </g>

        <!-- LEVEL 1 -->
        <g id="level1Group" style="display: none;">
            <rect width="900" height="1440" fill="url(#skyGrad)" />
            
            <!-- Lowered Sun in Level 1 -->
            <g id="level1Sun" class="pointer-events-auto cursor-pointer" transform="translate(450, 480)">
                <circle cx="0" cy="0" r="95" fill="#fef08a" opacity="0.5" class="sun-glow" />
                <circle cx="0" cy="0" r="75" fill="#fde047" opacity="0.9" class="sun-glow" />
                <circle cx="0" cy="0" r="55" fill="#facc15" />
            </g>

            <!-- 1. Gentle Hill (Left Side) -->
            <g id="mountainGroup" class="pointer-events-auto cursor-pointer" transform="translate(180, 1050)" onclick="initPuzzle('hill')">
                <path d="M -230 150 Q 50 -200 330 150 Z" fill="url(#hillGrad2)" />
                <path d="M -100 20 Q -30 -40 80 40" fill="none" stroke="#bbf7d0" stroke-width="12" stroke-linecap="round" opacity="0.7" />
            </g>

            <!-- 2. Realistic Excavation Hole with Dirt Mound (Center Front) -->
            <g id="holeGroup" class="pointer-events-auto cursor-pointer" transform="translate(360, 1020)" onclick="initPuzzle('fill')">
                <ellipse cx="90" cy="110" rx="100" ry="38" fill="#000000" opacity="0.15" />
                <ellipse cx="40" cy="75" rx="55" ry="26" fill="#78350f" opacity="0.9" />
                <ellipse cx="35" cy="70" rx="42" ry="18" fill="#92400e" />
                <ellipse cx="125" cy="90" rx="75" ry="32" fill="#451a03" stroke="#291102" stroke-width="5" />
                <ellipse cx="125" cy="94" rx="52" ry="20" fill="#1f0a01" />
            </g>

            <!-- 3. Calendar (Right Side) -->
            <g id="calendarGroup" class="pointer-events-auto cursor-pointer" transform="translate(560, 1020)" onclick="initPuzzle('will')">
                <rect x="0" y="20" width="120" height="130" fill="#ffffff" stroke="#cbd5e1" stroke-width="6" rx="12" />
                <rect x="0" y="20" width="120" height="35" fill="#ef4444" rx="12" />
                <circle cx="35" cy="15" r="8" fill="#64748b" />
                <circle cx="85" cy="15" r="8" fill="#64748b" />
                <text x="60" y="44" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">2026</text>
                <circle cx="30" cy="75" r="6" fill="#94a3b8" />
                <circle cx="60" cy="75" r="6" fill="#94a3b8" />
                <circle cx="90" cy="75" r="6" fill="#ef4444" />
                <circle cx="30" cy="105" r="6" fill="#94a3b8" />
                <circle cx="60" cy="105" r="6" fill="#94a3b8" />
                <circle cx="90" cy="105" r="6" fill="#94a3b8" />
            </g>

            <path d="M-50 1220 Q 300 1100 950 1220 L 950 1440 L -50 1440 Z" fill="url(#hillGrad1)" />
        </g>

        <!-- LEVEL 2 -->
        <g id="level2Group" style="display: none;">
            <rect width="900" height="1440" fill="url(#beachSkyGrad)" />
            
            <!-- Sun in Top Center for Level 2 -->
            <g id="level2Sun" class="pointer-events-auto cursor-pointer" transform="translate(450, 200)">
                <circle cx="0" cy="0" r="85" fill="#fed7aa" opacity="0.4" class="sun-glow" />
                <circle cx="0" cy="0" r="65" fill="#fdba74" opacity="0.8" class="sun-glow" />
                <circle cx="0" cy="0" r="48" fill="#fb923c" />
            </g>

            <rect x="0" y="350" width="900" height="520" fill="#38bdf8" />
            <path d="M 0 870 Q 450 820 900 870 L 900 1440 L 0 1440 Z" fill="#fde047" />

            <!-- Detailed Drum Set (Bottom Left) -->
            <g id="drumSetGroup" class="pointer-events-auto cursor-pointer" transform="translate(40, 1120)" onclick="initPuzzle('band')">
                <ellipse cx="60" cy="200" rx="60" ry="14" fill="#000000" opacity="0.35" />
                <!-- Bass Drum -->
                <circle cx="60" cy="110" r="50" fill="#ef4444" stroke="#cbd5e1" stroke-width="7" />
                <circle cx="60" cy="110" r="34" fill="#f8fafc" />
                <text x="60" y="117" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="900">ROCK</text>
                <!-- Snare Drum -->
                <circle cx="125" cy="130" r="30" fill="#3b82f6" stroke="#cbd5e1" stroke-width="5" />
                <!-- Cymbals -->
                <path d="M 10 70 Q 40 40 70 70 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
                <line x1="40" y1="70" x2="40" y2="135" stroke="#64748b" stroke-width="4" />
                <path d="M 90 50 Q 120 20 150 50 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
                <line x1="120" y1="50" x2="120" y2="100" stroke="#64748b" stroke-width="4" />
            </g>

            <!-- Detailed Crab (Middle-Left) -->
            <g id="crabGroup" class="pointer-events-auto cursor-pointer" transform="translate(250, 1160)" onclick="initPuzzle('and')">
                <ellipse cx="60" cy="110" rx="55" ry="12" fill="#000000" opacity="0.3" />
                <!-- Legs -->
                <path d="M 20 90 Q 5 70 10 50" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
                <path d="M 30 100 Q 15 90 25 70" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
                <path d="M 90 90 Q 105 70 100 50" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
                <path d="M 80 100 Q 95 90 85 70" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
                <!-- Body Shell -->
                <ellipse cx="60" cy="80" rx="42" ry="28" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
                <!-- Eyes -->
                <circle cx="46" cy="48" r="7" fill="#f8fafc" />
                <circle cx="46" cy="48" r="3" fill="#0f172a" />
                <circle cx="74" cy="48" r="7" fill="#f8fafc" />
                <circle cx="74" cy="48" r="3" fill="#0f172a" />
                <!-- Claws -->
                <path d="M 30 70 Q 10 50 25 35 Q 40 50 30 70" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
                <path d="M 90 70 Q 110 50 95 35 Q 80 50 90 70" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
            </g>

            <!-- Detailed Sand Castle (Middle-Right) -->
            <g id="sandCastleGroup" class="pointer-events-auto cursor-pointer" transform="translate(460, 1120)" onclick="initPuzzle('sand')">
                <ellipse cx="80" cy="180" rx="75" ry="14" fill="#000000" opacity="0.3" />
                <!-- Towers & Walls -->
                <rect x="40" y="80" width="80" height="100" fill="#facc15" stroke="#ca8a04" stroke-width="4" rx="6" />
                <rect x="10" y="110" width="45" height="70" fill="#eab308" stroke="#a16207" stroke-width="4" rx="6" />
                <rect x="105" y="110" width="45" height="70" fill="#eab308" stroke="#a16207" stroke-width="4" rx="6" />
                <!-- Crenellations (Battlements) -->
                <rect x="40" y="65" width="16" height="20" fill="#facc15" />
                <rect x="72" y="65" width="16" height="20" fill="#facc15" />
                <rect x="104" y="65" width="16" height="20" fill="#facc15" />
                <!-- Doorway & Windows -->
                <path d="M 70 180 L 70 140 Q 80 120 90 140 L 90 180 Z" fill="#78350f" />
                <circle cx="32" cy="135" r="8" fill="#78350f" />
                <circle cx="128" cy="135" r="8" fill="#78350f" />
                <!-- Flag -->
                <line x1="80" y1="65" x2="80" y2="30" stroke="#0f172a" stroke-width="4" />
                <polygon points="80,30 115,42 80,54" fill="#ef4444" />
            </g>

            <!-- Detailed Seagulls (Bottom Right) -->
            <g id="seagullsGroup" class="pointer-events-auto cursor-pointer" transform="translate(650, 1140)" onclick="initPuzzle('they')">
                <!-- Seagull 1 -->
                <path d="M 10 50 Q 30 20 50 50 Q 70 20 90 50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
                <circle cx="24" cy="42" r="4" fill="#0f172a" />
                <polygon points="2,47 10,49 2,52" fill="#f97316" />
                
                <!-- Seagull 2 -->
                <path d="M 70 100 Q 90 70 110 100 Q 130 70 150 100" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
                <circle cx="84" cy="93" r="3" fill="#0f172a" />
                <polygon points="63,98 70,100 63,103" fill="#f97316" />

                <!-- Seagull 3 -->
                <path d="M 40 140 Q 55 115 70 140 Q 85 115 100 140" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
                
                <!-- Additional Seagulls for rich beach feel -->
                <path d="M 130 40 Q 145 20 160 40 Q 175 20 190 40" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
            </g>
        </g>

        <!-- LEVEL 3 -->
        <g id="level3Group" style="display: none;">
            <rect width="900" height="1440" fill="url(#level3SkyGrad)" />

            <!-- Sun in Top Center for Level 3 -->
            <g id="level3Sun" class="pointer-events-auto cursor-pointer" transform="translate(450, 200)">
                <circle cx="0" cy="0" r="85" fill="#fbcfe8" opacity="0.4" class="sun-glow" />
                <circle cx="0" cy="0" r="65" fill="#f472b6" opacity="0.8" class="sun-glow" />
                <circle cx="0" cy="0" r="48" fill="#ec4899" />
            </g>

            <path d="M-50 1050 Q 250 920 950 1050 L 950 1440 L -50 1440 Z" fill="#6ee7b7" />
            <path d="M 0 1100 Q 450 1040 900 1100 L 900 1200 Q 450 1140 0 1200 Z" fill="#475569" />

            <!-- Level 3 Interactive Objects beside road at the very bottom -->
            <g id="notGroup" class="pointer-events-auto cursor-pointer" transform="translate(70, 930)" onclick="initPuzzle('not')">
                <rect x="30" y="70" width="14" height="90" fill="#78350f" />
                <rect x="5" y="15" width="64" height="60" fill="#fef08a" stroke="#ca8a04" stroke-width="5" rx="6" />
                <line x1="18" y1="28" x2="56" y2="62" stroke="#dc2626" stroke-width="7" stroke-linecap="round" />
                <line x1="56" y1="28" x2="18" y2="62" stroke="#dc2626" stroke-width="7" stroke-linecap="round" />
            </g>

            <!-- Ladybug positioned on the lower side of the road -->
            <g id="dotGroup" class="pointer-events-auto cursor-pointer" transform="translate(380, 1080)" onclick="initPuzzle('dot')">
                <ellipse cx="50" cy="50" rx="38" ry="32" fill="#ef4444" />
                <circle cx="38" cy="42" r="6" fill="#0f172a" />
                <circle cx="62" cy="54" r="6" fill="#0f172a" />
                <circle cx="78" cy="50" r="12" fill="#0f172a" />
            </g>

            <g id="potGroup" class="pointer-events-auto cursor-pointer" transform="translate(680, 890)" onclick="initPuzzle('pot')">
                <ellipse cx="75" cy="170" rx="45" ry="10" fill="#000000" opacity="0.3" />
                <rect x="38" y="85" width="74" height="85" fill="#b45309" rx="8" />
                <ellipse cx="75" cy="85" rx="38" ry="10" fill="#d97706" stroke="#92400e" stroke-width="3" />
                <line x1="75" y1="85" x2="75" y2="35" stroke="#22c55e" stroke-width="7" stroke-linecap="round" />
                <circle cx="75" cy="30" r="18" fill="#f43f5e" />
            </g>
        </g>
    </svg>

    <div id="celebrationScreen" class="absolute inset-0 bg-sky-900/95 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="text-6xl sm:text-7xl mb-6 animate-bounce">🦋✨🏆✨🦋</div>
        <h1 class="text-4xl sm:text-5xl font-black text-yellow-300 mb-4 drop-shadow-lg tracking-wide">Great Job!</h1>
        <p class="text-lg sm:text-xl text-white/90 mb-10 max-w-sm">You successfully completed all levels and spelled every word!</p>
        <button onclick="resetToStart()" class="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-900 font-extrabold text-lg px-8 py-4 rounded-3xl shadow-2xl transition-all active:scale-95 border-2 border-white/50">
            🔄 Start Over
        </button>
    </div>

    <div class="relative z-10 w-full h-full flex flex-col justify-between items-center p-4 sm:p-6 pointer-events-none">
        
        <!-- Top Navigation & Level Indicator -->
        <div id="topNavBar" class="pt-2 sm:pt-4 flex justify-between w-full max-w-md px-2 hidden">
            <button onclick="goBackLevel()" class="bg-white/90 hover:bg-white text-slate-700 font-bold text-sm px-4 py-2.5 rounded-2xl shadow-md border border-white/50 pointer-events-auto transition-all active:scale-95 flex items-center gap-2">
                ⬅️ Back
            </button>
            <div id="levelIndicator" class="bg-white/90 backdrop-blur-md px-5 py-2 rounded-full shadow-md text-slate-700 font-bold text-sm pointer-events-auto my-auto">
                Level 1
            </div>
            <div class="w-20"></div>
        </div>

        <!-- Center Game Board (Spelling Slots & Suggested Letters positioned safely above graphics) -->
        <div id="gameUIContainer" class="flex flex-col items-center gap-3 sm:gap-4 pointer-events-auto mt-28 sm:mt-32 hidden">
            
            <!-- Target Word Slots -->
            <div id="wordSlots" class="flex gap-2 sm:gap-3 bg-white/80 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-xl border border-white/60">
                <!-- Dynamically generated slots -->
            </div>

            <!-- Message Banner -->
            <div id="messageBanner" class="text-emerald-800 font-bold bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-lg text-sm transition-all opacity-0 text-center">
                🎉 Great job!
            </div>

            <!-- 8 Suggested Letter Buttons -->
            <div id="letterGrid" class="grid grid-cols-4 gap-2 bg-slate-900/60 backdrop-blur-md p-3 sm:p-4 rounded-3xl shadow-2xl border border-white/25 max-w-xs">
                <!-- Dynamically populated letters -->
            </div>
        </div>

        <!-- Footer Reset -->
        <div class="pb-2 pointer-events-auto flex gap-3">
            <button id="resetBtn" onclick="resetGame()" class="bg-white/90 hover:bg-white text-slate-700 font-semibold text-xs sm:text-sm px-4 py-2 rounded-xl shadow border border-white/50 transition-all active:scale-95 hidden">
                🔄 Reset Puzzle
            </button>
        </div>
    </div>

    <script>
        let currentGame = null; 
        let currentLevel = 0;

        const wordsConfig = {
            hill: { target: "HILL", prompt: "Can you please spell hill?" },
            fill: { target: "FILL", prompt: "Can you please spell fill?" },
            will: { target: "WILL", prompt: "Can you please spell will?" },
            band: { target: "BAND", prompt: "Can you please spell band?" },
            and: { target: "AND", prompt: "Can you please spell and?" },
            sand: { target: "SAND", prompt: "Can you please spell sand?" },
            they: { target: "THEY", prompt: "Can you please spell they?" },
            not: { target: "NOT", prompt: "Can you please spell not?" },
            dot: { target: "DOT", prompt: "Can you please spell dot?" },
            pot: { target: "POT", prompt: "Can you please spell pot?" }
        };

        let currentTargetWord = "HILL";
        let currentGuess = [];
        let shuffledLetters = [];
        let isCompleted = false;

        const slotsContainer = document.getElementById('wordSlots');
        const letterGrid = document.getElementById('letterGrid');
        const messageBanner = document.getElementById('messageBanner');
        const levelIndicator = document.getElementById('levelIndicator');
        const level0Group = document.getElementById('level0Group');
        const level1Group = document.getElementById('level1Group');
        const level2Group = document.getElementById('level2Group');
        const level3Group = document.getElementById('level3Group');
        const topNavBar = document.getElementById('topNavBar');
        const gameUIContainer = document.getElementById('gameUIContainer');
        const resetBtn = document.getElementById('resetBtn');
        const celebrationScreen = document.getElementById('celebrationScreen');

        function setLevel(lvl) {
            currentLevel = lvl;
            currentGame = null;
            currentGuess = [];
            shuffledLetters = [];
            messageBanner.style.opacity = '0';
            celebrationScreen.classList.add('hidden');

            level0Group.style.display = lvl === 0 ? 'block' : 'none';
            level1Group.style.display = lvl === 1 ? 'block' : 'none';
            level2Group.style.display = lvl === 2 ? 'block' : 'none';
            level3Group.style.display = lvl === 3 ? 'block' : 'none';

            if (lvl === 0) {
                topNavBar.classList.add('hidden');
                gameUIContainer.classList.add('hidden');
                resetBtn.classList.add('hidden');
            } else {
                topNavBar.classList.remove('hidden');
                gameUIContainer.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
                
                if (lvl === 1) levelIndicator.textContent = "Level 1: Hills";
                if (lvl === 2) levelIndicator.textContent = "Level 2: Beach";
                if (lvl === 3) levelIndicator.textContent = "Level 3: Garden";

                renderSlots();
                renderLetters();
            }
        }

        function goBackLevel() {
            if (currentLevel > 0) {
                setLevel(currentLevel - 1);
            }
        }

        function initPuzzle(gameType) {
            currentGame = gameType;
            currentTargetWord = wordsConfig[gameType].target;
            currentGuess = new Array(currentTargetWord.length).fill("");
            isCompleted = false;
            messageBanner.style.opacity = '0';
            slotsContainer.classList.remove('animate-success');

            const correctLetters = currentTargetWord.split('');
            const distractorCount = Math.max(0, 8 - correctLetters.length);
            const distractors = ['A', 'S', 'T', 'O', 'E', 'R', 'P', 'B', 'M', 'C', 'L', 'I', 'H', 'N', 'Y', 'D', 'W'];
            const randomDistractors = distractors.sort(() => 0.5 - Math.random()).slice(0, distractorCount);
            
            shuffledLetters = [...correctLetters, ...randomDistractors].sort(() => 0.5 - Math.random()).map((char, index) => ({
                id: index,
                char: char,
                used: false
            }));
            renderLetters();
            renderSlots();
            promptCurrentWord();
        }

        function renderSlots() {
            slotsContainer.innerHTML = '';
            for (let i = 0; i < currentTargetWord.length; i++) {
                const char = currentGuess[i];
                const slotDiv = document.createElement('div');
                slotDiv.className = `w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center text-2xl font-extrabold shadow-sm transition-all animate-pop ${
                    char ? 'bg-emerald-500 text-white border-2 border-emerald-600 shadow-emerald-500/30' : 'bg-white/90 border-2 border-dashed border-slate-300 text-slate-700'
                }`;
                slotDiv.textContent = char || '_';
                if (char) {
                    slotDiv.onclick = () => removeLetter(i);
                    slotDiv.style.cursor = "pointer";
                }
                slotsContainer.appendChild(slotDiv);
            }
        }

        function renderLetters() {
            letterGrid.innerHTML = '';
            shuffledLetters.forEach((item) => {
                const btn = document.createElement('button');
                btn.className = `w-12 h-12 rounded-2xl text-xl font-extrabold transition-all shadow-lg flex items-center justify-center ${
                    item.used 
                        ? 'bg-slate-300/50 text-slate-400 border border-slate-300/30 cursor-not-allowed scale-95 opacity-50' 
                        : 'bg-gradient-to-br from-amber-400 to-orange-500 text-white border border-amber-300 active:scale-95 shadow-orange-500/30'
                }`;
                btn.textContent = item.char;
                btn.disabled = item.used || isCompleted;
                btn.onclick = () => selectLetter(item);
                letterGrid.appendChild(btn);
            });
        }

        function selectLetter(item) {
            if (isCompleted || !currentGame) return;
            const nextIndex = currentGuess.findIndex(val => val === "");
            if (nextIndex !== -1) {
                currentGuess[nextIndex] = item.char;
                item.used = true;
                renderLetters();
                renderSlots();

                if (!currentGuess.includes("")) {
                    checkWinCondition();
                }
            }
        }

        function removeLetter(slotIndex) {
            if (isCompleted) return;
            const charToRemove = currentGuess[slotIndex];
            if (!charToRemove) return;

            const tile = shuffledLetters.find(t => t.char === charToRemove && t.used);
            if (tile) tile.used = false;
            currentGuess[slotIndex] = "";
            renderLetters();
            renderSlots();
            messageBanner.style.opacity = '0';
        }

        function checkWinCondition() {
            const guessWord = currentGuess.join("");
            if (guessWord === currentTargetWord) {
                isCompleted = true;
                messageBanner.textContent = `🎉 Awesome! You spelled ${currentTargetWord}!`;
                messageBanner.style.opacity = '1';
                slotsContainer.classList.add('animate-success');

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(`Fantastic! You spelled ${currentTargetWord.toLowerCase()} correctly!`);
                    utterance.rate = 0.95;
                    utterance.pitch = 1.1;
                    const voices = window.speechSynthesis.getVoices();
                    const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
                    if (preferredVoice) utterance.voice = preferredVoice;
                    window.speechSynthesis.speak(utterance);
                }

                setTimeout(() => {
                    if (currentLevel === 1) {
                        if (currentGame === 'hill') window.unlockedHill = true;
                        if (currentGame === 'fill') window.unlockedFill = true;
                        if (currentGame === 'will') window.unlockedWill = true;

                        if (window.unlockedHill && window.unlockedFill && window.unlockedWill) {
                            setLevel(2);
                        }
                    } else if (currentLevel === 2) {
                        if (currentGame === 'band') window.unlockedBand = true;
                        if (currentGame === 'and') window.unlockedAnd = true;
                        if (currentGame === 'sand') window.unlockedSand = true;
                        if (currentGame === 'they') window.unlockedThey = true;

                        if (window.unlockedBand && window.unlockedAnd && window.unlockedSand && window.unlockedThey) {
                            setLevel(3);
                        }
                    } else if (currentLevel === 3) {
                        if (currentGame === 'not') window.unlockedNot = true;
                        if (currentGame === 'dot') window.unlockedDot = true;
                        if (currentGame === 'pot') window.unlockedPot = true;

                        if (window.unlockedNot && window.unlockedDot && window.unlockedPot) {
                            triggerCelebrationScreen();
                        }
                    }
                }, 1500);

            } else {
                messageBanner.textContent = "❌ Not quite right! Tap letters to clear and try again.";
                messageBanner.style.opacity = '1';
            }
        }

        function triggerCelebrationScreen() {
            celebrationScreen.classList.remove('hidden');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utt = new SpeechSynthesisUtterance("Great job! You completed all levels!");
                window.speechSynthesis.speak(utt);
            }
        }

        function resetToStart() {
            window.unlockedHill = false;
            window.unlockedFill = false;
            window.unlockedWill = false;
            window.unlockedBand = false;
            window.unlockedAnd = false;
            window.unlockedSand = false;
            window.unlockedThey = false;
            window.unlockedNot = false;
            window.unlockedDot = false;
            window.unlockedPot = false;
            setLevel(0);
        }

        function promptCurrentWord() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(wordsConfig[currentGame].prompt);
            utterance.rate = 0.9;
            utterance.pitch = 1.05;
            
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }

        function resetGame() {
            if (currentGame) initPuzzle(currentGame);
        }

        // Event Listeners for Suns and Navigation
        document.getElementById('level0Sun').addEventListener('click', (e) => { e.stopPropagation(); setLevel(1); });
        document.getElementById('level1Sun').addEventListener('click', (e) => { e.stopPropagation(); if (currentLevel === 1) setLevel(2); });
        document.getElementById('level2Sun').addEventListener('click', (e) => { e.stopPropagation(); if (currentLevel === 2) setLevel(3); });
        document.getElementById('level3Sun').addEventListener('click', (e) => { e.stopPropagation(); if (currentLevel === 3) triggerCelebrationScreen(); });

        window.addEventListener('load', () => {
            setLevel(0);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {};
            }
        });
    </script>
</body>
</html>
